name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  frontend:
    name: 前端检查与测试
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build

  rust:
    name: Rust 测试与编译检查
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: cargo check
        working-directory: src-tauri
        run: cargo check --all-targets
      - name: cargo test
        working-directory: src-tauri
        run: cargo test

  build:
    name: Windows 安装包构建
    runs-on: windows-latest
    needs: [frontend, rust]
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - run: npm run tauri build
      - uses: actions/upload-artifact@v7
        with:
          name: CheckIt-windows-installer
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

  publish:
    name: 发布正式版本
    needs: [build]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v7
        with:
          name: CheckIt-windows-installer
          path: release-assets
      - name: 校验版本并生成校验文件和说明
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $version=(Get-Content package.json -Raw | ConvertFrom-Json).version
          if($env:GITHUB_REF_NAME -cne "v$version"){throw '标签与项目版本不一致'}
          $installer=Get-Item -LiteralPath "release-assets/CheckIt_${version}_x64-setup.exe"
          $hash=(Get-FileHash -LiteralPath $installer.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $($installer.Name)" | Set-Content release-assets/SHA256SUMS.txt -Encoding ascii
          $log=Get-Content CHANGELOG.md -Raw
          $pattern='(?ms)^## \['+[regex]::Escape($version)+'\][^\r\n]*\r?\n(.*?)(?=^## \[|\z)'
          $match=[regex]::Match($log,$pattern)
          if(-not $match.Success){throw '缺少当前版本更新说明'}
          $match.Groups[1].Value.Trim() | Set-Content release-assets/release-notes.md -Encoding utf8
      - name: 发布已通过检查的安装包
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $version=(Get-Content package.json -Raw | ConvertFrom-Json).version
          gh release create $env:GITHUB_REF_NAME "release-assets/CheckIt_${version}_x64-setup.exe" release-assets/SHA256SUMS.txt --verify-tag --latest --title "CheckIt $env:GITHUB_REF_NAME" --notes-file release-assets/release-notes.md
          if($LASTEXITCODE -ne 0){exit $LASTEXITCODE}
