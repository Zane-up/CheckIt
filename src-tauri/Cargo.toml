[package]
name = "checkit"
version = "0.1.0"
description = "Check it. Get it done. 玻璃态桌面任务管理与截止时间提醒工具"
authors = ["CheckIt Contributors"]
license = "MIT"
repository = "https://github.com/Zane-up/CheckIt"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "checkit_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "checkit"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
# 单实例保护：第二次启动在 setup/数据库迁移/调度器之前被拦截。
tauri-plugin-single-instance = "2"
tauri-plugin-notification = "2"
tauri-plugin-autostart = "2"
# 与 tauri-plugin-notification 共用底层实现；直接调用以取得同步提交结果。
notify-rust = "4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.37", features = ["bundled"] }
chrono = { version = "0.4", features = ["serde"] }
parking_lot = "0.12"
log = "0.4"

# 贴边收纳：在窗口所属线程订阅原生移动/缩放会话。
[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
